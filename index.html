<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Motion Studio — 2D Animation</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">M</span><span class="brand-name">Motion <b>Studio</b></span></div><div class="project-name"><span class="status-dot"></span><input id="projectName" aria-label="Project name" value="Untitled animation"></div><div class="header-actions"><button id="newProject">New</button><button id="saveProject">Save <span>JSON</span></button><label class="button">Import<input id="importProject" type="file" accept="application/json,.json" hidden></label><label class="button">Assets<input id="assetImport" type="file" accept="image/*" multiple hidden></label><button id="exportFrames" class="accent">PNGs</button></div></header>
<main class="workspace"><aside class="toolbar panel" aria-label="Drawing tools"><button class="tool active" data-tool="brush"><span>✎</span><small>Brush</small></button><button class="tool" data-tool="eraser"><span>⌫</span><small>Erase</small></button><button class="tool" data-tool="line"><span>╱</span><small>Line</small></button><button class="tool" data-tool="rect"><span>□</span><small>Rect</small></button><button class="tool" data-tool="circle"><span>○</span><small>Circle</small></button><i></i><button id="undo" class="tool"><span>↶</span><small>Undo</small></button><button id="redo" class="tool"><span>↷</span><small>Redo</small></button><button id="clearCanvas" class="tool danger"><span>✕</span><small>Clear</small></button></aside>
<section class="editor"><div class="canvas-bar"><div class="breadcrumbs">Scene 01 <span>›</span> <b id="frameLabel">Frame 01</b></div><div class="canvas-actions"><label title="Show neighboring drawings"><input id="onion" type="checkbox"> Onion</label><label class="onion-opacity">Ghost <input id="onionOpacity" type="range" min="5" max="60" value="25"></label><button id="zoomOut">−</button><span id="zoomValue">100%</span><button id="zoomIn">+</button><button id="zoomReset">Fit</button></div></div><div class="stage-wrap" id="stageWrap"><div class="stage" id="stage"><canvas id="onionCanvas"></canvas><canvas id="drawCanvas"></canvas><canvas id="assetCanvas"></canvas></div></div></section>
<aside class="rightbar"><section class="panel inspector"><h2>Brush settings</h2><label>Color <input id="color" type="color" value="#7868ff"></label><label>Size <output id="sizeOutput">8 px</output><input id="brushSize" type="range" min="1" max="60" value="8"></label><div class="brush-preview"><span id="brushDot"></span>Brush preview</div></section><section class="panel inspector transform"><div class="panel-title"><h2>Character transform</h2><button id="deleteAsset" title="Delete selected character">×</button></div><p id="assetHint">Import an image to place a character.</p><div id="transformFields" hidden><label>X <output id="xOut"></output><input id="assetX" type="range" min="0" max="800"></label><label>Y <output id="yOut"></output><input id="assetY" type="range" min="0" max="500"></label><label>Scale <output id="scaleOut"></output><input id="assetScale" type="range" min="10" max="250"></label><label>Rotation <output id="rotateOut"></output><input id="assetRotate" type="range" min="-180" max="180"></label><button id="flipAsset">⇋ Flip horizontal</button><button id="keyframeAsset" class="accent">◆ Set keyframe</button></div></section><section class="panel layers"><div class="panel-title"><h2>Layers</h2><button id="addLayer">+</button></div><div id="layerList"></div></section><section class="panel assets"><div class="panel-title"><h2>Characters</h2><label class="mini-button">+<input id="assetImport2" type="file" accept="image/*" multiple hidden></label></div><div id="assetList"></div></section></aside></main>
<footer class="timeline panel"><div class="playback"><button id="play" class="play">▶</button><button id="prevFrame">‹</button><button id="nextFrame">›</button><label>FPS <input id="fps" type="number" min="1" max="30" value="12"></label><button id="audioImport" title="Import soundtrack">♫ Audio</button><input id="audioFile" type="file" accept="audio/*" hidden><span id="timeReadout">0:00 / 0:00</span></div><div class="timeline-body"><div id="layerTracks" class="layer-tracks"></div><div class="frame-strip" id="frameStrip"></div></div><div class="frame-actions"><button id="addFrame">+ Frame</button><button id="duplicateFrame">⧉</button><button id="deleteFrame" class="danger">⌫</button><button id="exportVideo">Video</button><button id="exportGif">GIF</button></div></footer><audio id="audio" preload="auto"></audio><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
