name: Daily AI YouTube Shorts

on:
  schedule:
    # 09:00 IST = 03:30 UTC
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install -r automation/youtube/requirements.txt

      - name: Build five videos and upload privately
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: private
          VIDEO_COUNT: '5'
        run: python automation/youtube/main.py

      - name: Save all generated videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-five-youtube-shorts
          path: automation/youtube/work/
          if-no-files-found: ignore
          retention-days: 3
